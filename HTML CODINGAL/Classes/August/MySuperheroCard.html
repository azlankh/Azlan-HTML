<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>My Superhero Card</title>
    </head>
    <style>
        body {
            background-color: rgba(82, 255, 145, 0.759);
        }

        .HeroName {
            color: rgba(44, 115, 153, 0.759);
            font-size: 80px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #002440;
        }
        .tagline{
            color: rgba(0, 37, 57, 0.759);
            font-size: 30px;
            text-transform: capitalize;
            font-weight: bold, italic;
        }
        .headers{
            color: #2d0081;
            text-transform: uppercase;
            font-size: 50px;
        }
        .power{
            color: rgba(0, 37, 57, 0.759);
            font-size: 30px;
            text-transform: capitalize;
            font-weight: bold;
        }
        .weakness{
            color:#0e06ff;
            font-size: 30px;
            text-transform: capitalize;
            text-decoration: line-through;
        }
        .badge{
            color: rgba(0, 21, 255, 0.759);
            font-size: 60px;
            text-transform: capitalize;
            font-weight: bold;
        }
        .made{
            color: rgba(0, 37, 57, 0.759);
            font-size: 20px;
            text-transform: capitalize;
            font-weight: bold;
        }
    </style>
    <body>
        <center>
            <h1 class="HeroName">Thunder Kid</h1>
            <p class="tagline">protector of the galaxy! he helps everybody</p>
            <h2 class="headers">powers</h2>
            <p class="power">Super Speed</p>
            <p class="power">Super Strength</p>
            <h2 class="headers">weakness</h2>
            <p class="weakness">Ice Crystals</p>
            <p class="badge">Hero:o</p>
            <p class="made">Made by Azlan</p>
        </center>
    </body>
</html>
