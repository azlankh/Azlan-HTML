    <h1>Words That Inspire</h1>
    <h3>Albert Einstein's Quote</h3>
    <p>He said, <q><em>Imagination is more important than knowledge.</em></q></p>
    <h3>Walt Disney's Quote</h3>
    <p>He said, <q><em>All our dreams can come true, if we have the courage to pursue them.</em></q></p>
    <h3>Steve Jobs' Quote</h3>
    <p>He said, <q><em>Your time is limited, so don't waste it living someone else's life.</em></q></p>
